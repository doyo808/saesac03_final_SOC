spring:
  application:
    name: campus-platform-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/campus}
    username: ${DB_USERNAME:campus}
    password: ${DB_PASSWORD:campus}
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: INFO

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-this-please-dev-only-secret-change-this}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:30}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:7}
    refresh-cookie-name: ${JWT_REFRESH_COOKIE_NAME:refresh_token}
    refresh-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE:false}
  admin:
    network:
      enabled: ${ADMIN_NETWORK_ENABLED:false}
      allowed-ip-ranges: ${ADMIN_ALLOWED_IP_RANGES:}
      use-forwarded-for: ${ADMIN_USE_FORWARDED_FOR:false}
      forwarded-for-header: ${ADMIN_FORWARDED_FOR_HEADER:X-Forwarded-For}

services:
  campus-was:
    image: campus-was:latest
    container_name: campus-was
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://10.10.20.30:5432/campus
      DB_USERNAME: campus
      DB_PASSWORD: campus
      JWT_SECRET: change-this-to-a-strong-secret
      JWT_REFRESH_COOKIE_SECURE: "true"
      ADMIN_NETWORK_ENABLED: "true"
      ADMIN_ALLOWED_IP_RANGES: 10.10.30.40/32
      SECURITY_EGRESS_TEST_ENABLED: "true"
      SECURITY_EGRESS_TEST_BASE_URL: http://192.168.40.100:8081
      SECURITY_EGRESS_TEST_ALLOWED_USER_EMAILS: admin1@campus.local,student1@campus.local
      SECURITY_EGRESS_TEST_CONNECT_TIMEOUT_MS: "2000"
      SECURITY_EGRESS_TEST_READ_TIMEOUT_MS: "3000"

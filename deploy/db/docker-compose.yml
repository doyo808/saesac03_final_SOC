services:
  campus-postgres:
    image: ${DB_IMAGE:-postgres:16}
    container_name: campus-postgres
    restart: unless-stopped
    ports:
      - "${DB_BIND_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ${DB_DATA_VOLUME:-campus_postgres_data}:/var/lib/postgresql/data

volumes:
  campus_postgres_data:
    name: ${DB_DATA_VOLUME:-campus_postgres_data}

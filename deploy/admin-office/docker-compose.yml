services:
  campus-admin-web:
    image: ${WEB_ADMIN_IMAGE:?set WEB_ADMIN_IMAGE in .env}
    container_name: campus-admin-web
    restart: unless-stopped
    ports:
      - "${WEB_ADMIN_BIND_PORT:-8081}:80"
    env_file:
      - .env
    environment:
      WAS_UPSTREAM: ${WAS_UPSTREAM:?set WAS_UPSTREAM in .env}
